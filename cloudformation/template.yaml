AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Protects an existing S3 bucket behind CloudFront with Keycloak (OIDC) SSO.
  Pulls in only the Lambda@Edge functions from cloudfront-authorization-at-edge
  (SAR, aws-samples) as a nested stack; the CloudFront distribution and S3 bucket
  policy for the existing bucket are defined directly in this template.
  NOTE: due to Lambda@Edge constraints, this stack must be deployed in us-east-1.
  NOTE: deployment requires --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND.

Parameters:
  ExistingS3BucketName:
    Type: String
    Description: >
      Name of the existing S3 bucket to protect. Block Public Access can stay
      enabled (this stack adds a bucket policy that only allows access via the
      CloudFront OAI). If the bucket already has a bucket policy, review it
      first: this stack's policy replaces it entirely.

  ExistingS3BucketRegion:
    Type: String
    Default: us-east-1
    Description: >
      The region where ExistingS3BucketName actually lives. This stack itself
      must deploy to us-east-1 (Lambda@Edge constraint), but the protected
      bucket can be in any region (a CloudFront S3 origin works cross-region).
      A value that doesn't match the bucket's real region causes an origin
      connection error, so set this accurately.

  AppDomainName1:
    Type: String
    Description: >
      Custom domain name to attach to CloudFront (primary domain, required.
      e.g. files.example.com). Used as the base domain for Cognito callback
      URLs and the AppUrl output.

  AppDomainName2:
    Type: String
    Default: ""
    Description: Additional custom domain (optional, 2nd). Leave blank if unused.

  AppDomainName3:
    Type: String
    Default: ""
    Description: Additional custom domain (optional, 3rd). Leave blank if unused.

  AppDomainName4:
    Type: String
    Default: ""
    Description: Additional custom domain (optional, 4th). Leave blank if unused.

  AppDomainName5:
    Type: String
    Default: ""
    Description: >
      Additional custom domain (optional, 5th). Leave blank if unused. All
      domains given across AppDomainName1-5 must be covered by a single ACM
      certificate (SAN). Supporting more than 5 domains requires extending the
      template (add AppDomainName6+ and the matching Conditions/resources).

  AcmCertificateArn:
    Type: String
    Description: ARN of the ACM certificate for CloudFront (must be issued in us-east-1)

  HostedZoneId:
    Type: String
    Default: ""
    Description: >
      Optional. When set, a Route53 Hosted Zone ID for which this stack will
      create Alias records for each of AppDomainName1-5 (assumes all domains
      belong to the same Hosted Zone). Leave blank when managing DNS manually.

  KeycloakIssuerUrl:
    Type: String
    Description: >
      Keycloak's OIDC issuer URL (e.g. https://keycloak.example.com/realms/myrealm).
      Whether it has a trailing slash must match what Keycloak's actual
      discovery document (/.well-known/openid-configuration) reports.

  KeycloakClientId:
    Type: String
    Description: Client ID of the confidential client already created in Keycloak

  KeycloakClientSecret:
    Type: String
    NoEcho: true
    Description: Client secret of the Keycloak confidential client

  CognitoDomainPrefix:
    Type: String
    AllowedPattern: "^[a-z0-9-]+$"
    Description: >
      Prefix for the Cognito Hosted UI domain (letters, digits and - only;
      must be globally unique). The resulting domain is
      <prefix>.auth.<region>.amazoncognito.com.

  UserPoolGroupName:
    Type: String
    Default: NRKKUsers
    Description: >
      Name of the group that is allowed access. Create a group with this same
      name in Keycloak and add the users you want to grant access to it. At
      sign-in, the group list Keycloak sends (the groups claim) is copied into
      the cognito:groups claim via a Pre Token Generation Lambda, and
      cloudfront-authorization-at-edge grants or denies access based on
      whether this value is present there.
      NOTE: this also requires adding a "Group Membership" protocol mapper to
      the Keycloak client so the groups claim is included in the ID/access token.

Conditions:
  CreateDnsRecord: !Not [!Equals [!Ref HostedZoneId, ""]]

  # AppDomainName2〜5 が指定されているか (空文字なら未使用スロットとして扱う)
  HasDomain2: !Not [!Equals [!Ref AppDomainName2, ""]]
  HasDomain3: !Not [!Equals [!Ref AppDomainName3, ""]]
  HasDomain4: !Not [!Equals [!Ref AppDomainName4, ""]]
  HasDomain5: !Not [!Equals [!Ref AppDomainName5, ""]]

  CreateDnsRecord2: !And [!Condition CreateDnsRecord, !Condition HasDomain2]
  CreateDnsRecord3: !And [!Condition CreateDnsRecord, !Condition HasDomain3]
  CreateDnsRecord4: !And [!Condition CreateDnsRecord, !Condition HasDomain4]
  CreateDnsRecord5: !And [!Condition CreateDnsRecord, !Condition HasDomain5]

Resources:
  # ---------------------------------------------------------------------
  # Cognito User Pool + Keycloak(OIDC) IdP
  # ---------------------------------------------------------------------

  # Pre Token Generation Lambda: Keycloakのgroupsクレームが custom:groups にJITマッピングされた値を
  # 読み取り、JWTの cognito:groups クレームに上書き注入する(Keycloak側のグループ管理と同期させるため)
  PreTokenGenerationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PreTokenGenerationFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PreTokenGenerationRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          from urllib.parse import unquote

          def handler(event, context):
              raw = event["request"]["userAttributes"].get("custom:groups", "")
              groups = _parse_groups(raw)
              print(f"custom:groups raw={raw!r} parsed={groups!r}")
              event["response"] = {
                  "claimsOverrideDetails": {
                      "groupOverrideDetails": {
                          "groupsToOverride": groups
                      }
                  }
              }
              return event

          def _normalize(value):
              return unquote(str(value)).strip().lstrip("/")

          def _parse_groups(raw):
              if not raw:
                  return []
              # Cognitoは配列型クレームをJSONではなく "[a,b]" 形式(クォート無し)で
              # カスタム属性に格納するため、独自にブラケットを除去してから分割する
              text = raw.strip()
              if text.startswith("[") and text.endswith("]"):
                  text = text[1:-1]
              return [_normalize(g) for g in text.split(",") if g.strip()]

  PreTokenGenerationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreTokenGenerationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      # groups: KeycloakのAttributeMapping経由でJITマッピングされる、ログインごとに最新化される
      # (Mutable: true が必須。既存User Poolへの属性追加はin-placeで反映され、置き換えは発生しない)
      Schema:
        - Name: groups
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MaxLength: "2048"
      LambdaConfig:
        PreTokenGeneration: !GetAtt PreTokenGenerationFunction.Arn

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  KeycloakIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Keycloak
      ProviderType: OIDC
      ProviderDetails:
        client_id: !Ref KeycloakClientId
        client_secret: !Ref KeycloakClientSecret
        attributes_request_method: GET
        oidc_issuer: !Ref KeycloakIssuerUrl
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        username: sub
        # KeycloakのGroup Membershipプロトコルマッパーが出力する groups クレームを
        # custom:groups にJITマッピングする(ログインごとに最新化される)
        "custom:groups": groups

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: KeycloakIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-client"
      GenerateSecret: true
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      # aws.cognito.signin.user.admin は付けない: このスコープがあるとユーザー自身のアクセストークンで
      # UpdateUserAttributesが呼べてしまい、custom:groups(Keycloak由来のグループ情報、アクセス制御に
      # 使用)を自分で書き換えてグループ制限をバイパスできてしまう
      AllowedOAuthScopes: [openid, email, profile, phone]
      SupportedIdentityProviders: [Keycloak]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      CallbackURLs:
        - !Sub "https://${AppDomainName1}/parseauth"
        - !If [HasDomain2, !Sub "https://${AppDomainName2}/parseauth", !Ref AWS::NoValue]
        - !If [HasDomain3, !Sub "https://${AppDomainName3}/parseauth", !Ref AWS::NoValue]
        - !If [HasDomain4, !Sub "https://${AppDomainName4}/parseauth", !Ref AWS::NoValue]
        - !If [HasDomain5, !Sub "https://${AppDomainName5}/parseauth", !Ref AWS::NoValue]
      LogoutURLs:
        - !Sub "https://${AppDomainName1}/"
        - !If [HasDomain2, !Sub "https://${AppDomainName2}/", !Ref AWS::NoValue]
        - !If [HasDomain3, !Sub "https://${AppDomainName3}/", !Ref AWS::NoValue]
        - !If [HasDomain4, !Sub "https://${AppDomainName4}/", !Ref AWS::NoValue]
        - !If [HasDomain5, !Sub "https://${AppDomainName5}/", !Ref AWS::NoValue]

  # ---------------------------------------------------------------------
  # UserPoolClient の ClientSecret は CloudFormation の GetAtt で取得できないため、
  # カスタムリソース(Lambda)で DescribeUserPoolClient を呼んで取得する
  # ---------------------------------------------------------------------
  ClientSecretFetcherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DescribeUserPoolClient
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cognito-idp:DescribeUserPoolClient
                Resource: !GetAtt UserPool.Arn

  ClientSecretFetcherFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ClientSecretFetcherRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3

          def handler(event, context):
              request_type = event["RequestType"]
              physical_id = event.get("PhysicalResourceId") or event["LogicalResourceId"]
              data = {}
              try:
                  if request_type in ("Create", "Update"):
                      props = event["ResourceProperties"]
                      client = boto3.client("cognito-idp")
                      resp = client.describe_user_pool_client(
                          UserPoolId=props["UserPoolId"],
                          ClientId=props["ClientId"],
                      )
                      data["ClientSecret"] = resp["UserPoolClient"]["ClientSecret"]
                  _send(event, context, "SUCCESS", data, physical_id)
              except Exception as e:
                  _send(event, context, "FAILED", {}, physical_id, reason=str(e))

          def _send(event, context, status, data, physical_id, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or ("See CloudWatch Logs: " + context.log_stream_name),
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": True,
                  "Data": data,
              }).encode("utf-8")
              req = urllib.request.Request(
                  url=event["ResponseURL"],
                  data=body,
                  method="PUT",
                  headers={"Content-Type": ""},
              )
              urllib.request.urlopen(req)

  UserPoolClientSecret:
    Type: Custom::CognitoUserPoolClientSecret
    Properties:
      ServiceToken: !GetAtt ClientSecretFetcherFunction.Arn
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient

  # ---------------------------------------------------------------------
  # cloudfront-authorization-at-edge (SAR) - Lambda@Edge 関数のみ利用する
  # (CreateCloudFrontDistribution: false のため CloudFront/S3 は自前で構成)
  # ---------------------------------------------------------------------
  AuthAtEdge:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-1:520945424137:applications/cloudfront-authorization-at-edge
        SemanticVersion: 2.3.2
      Parameters:
        UserPoolArn: !GetAtt UserPool.Arn
        UserPoolAuthDomain: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
        UserPoolClientId: !Ref UserPoolClient
        UserPoolClientSecret: !GetAtt UserPoolClientSecret.ClientSecret
        # Pre Token Generation Lambda が cognito:groups に注入するKeycloak側のグループ名と
        # 一致させる。Keycloak側で同名グループに所属しているユーザーのみアクセス可能になる。
        UserPoolGroupName: !Ref UserPoolGroupName
        # 実際にリリースされているSAR v2.3.2のパラメータ名は Aliases ではなく AlternateDomainNames。
        # AcmCertificateArn パラメータはこのバージョンには存在しない(CreateCloudFrontDistribution:
        # "false" のためCloudFront/証明書はこのnested app内では扱われない)。
        # AlternateDomainNames を指定すると、持ち込んだ UserPoolClientId 側の CallbackURLs/LogoutURLs
        # にもこのドメインの分が自動追加される(こちら側でも明示的に設定済みなので重複しても実害はない)。
        AlternateDomainNames: !Ref AppDomainName1
        EnableSPAMode: "false"
        CreateCloudFrontDistribution: "false"
        # nested app自身もLambda@Edge内で認可リクエストのscopeを組み立てるため、
        # UserPoolClient.AllowedOAuthScopes と同じ内容に揃える必要がある
        # (aws.cognito.signin.user.adminを含めるとCognito側がinvalid_scopeで拒否する)
        OAuthScopes: "phone,email,profile,openid"
        CookieSettings: |-
          {
            "idToken": "Path=/; Secure; SameSite=Lax",
            "accessToken": null,
            "refreshToken": null,
            "nonce": null
          }

  # ---------------------------------------------------------------------
  # CloudFront Distribution (既存S3バケットをOAI経由で保護)
  # ---------------------------------------------------------------------
  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "OAI for ${AppDomainName1}"

  ExistingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ExistingS3BucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${ExistingS3BucketName}/*"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} - Keycloak SSO protected S3"
        DefaultRootObject: index.html
        Aliases:
          - !Ref AppDomainName1
          - !If [HasDomain2, !Ref AppDomainName2, !Ref AWS::NoValue]
          - !If [HasDomain3, !Ref AppDomainName3, !Ref AWS::NoValue]
          - !If [HasDomain4, !Ref AppDomainName4, !Ref AWS::NoValue]
          - !If [HasDomain5, !Ref AppDomainName5, !Ref AWS::NoValue]
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: protected-origin
            DomainName: !Sub "${ExistingS3BucketName}.s3.${ExistingS3BucketRegion}.amazonaws.com"
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOAI}"
          - Id: dummy-origin
            DomainName: example.org
            CustomOriginConfig:
              OriginProtocolPolicy: match-viewer
              HTTPPort: 80
              HTTPSPort: 443
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: protected-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
          LambdaFunctionAssociations:
            - EventType: viewer-request
              LambdaFunctionARN: !GetAtt AuthAtEdge.Outputs.CheckAuthHandler
            - EventType: origin-response
              LambdaFunctionARN: !GetAtt AuthAtEdge.Outputs.HttpHeadersHandler
        CacheBehaviors:
          - PathPattern: /parseauth
            TargetOriginId: dummy-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: all
            LambdaFunctionAssociations:
              - EventType: viewer-request
                LambdaFunctionARN: !GetAtt AuthAtEdge.Outputs.ParseAuthHandler
          - PathPattern: /refreshauth
            TargetOriginId: dummy-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: all
            LambdaFunctionAssociations:
              - EventType: viewer-request
                LambdaFunctionARN: !GetAtt AuthAtEdge.Outputs.RefreshAuthHandler
          - PathPattern: /signout
            TargetOriginId: dummy-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            ForwardedValues:
              QueryString: true
              Cookies:
                Forward: all
            LambdaFunctionAssociations:
              - EventType: viewer-request
                LambdaFunctionARN: !GetAtt AuthAtEdge.Outputs.SignOutHandler

  DnsRecord1:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomainName1
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        # CloudFrontのAliasターゲット用HostedZoneIdは全リージョン共通の固定値
        HostedZoneId: Z2FDTNDATAQYW2

  DnsRecord2:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecord2
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomainName2
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DnsRecord3:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecord3
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomainName3
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DnsRecord4:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecord4
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomainName4
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DnsRecord5:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecord5
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppDomainName5
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  CloudFrontDistributionDomainName:
    Description: CloudFront's default domain name
    Value: !GetAtt CloudFrontDistribution.DomainName

  AppUrl:
    Description: Application URL (primary domain = AppDomainName1)
    Value: !Sub "https://${AppDomainName1}/"

  CognitoUserPoolId:
    Value: !Ref UserPool

  CognitoUserPoolClientId:
    Value: !Ref UserPoolClient

  CognitoHostedUIDomain:
    Description: Cognito Hosted UI domain
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

  KeycloakRedirectUriToRegister:
    Description: >
      URI that must be registered in the Keycloak client's Valid Redirect URIs.
      Add this URI to the allow-list in the Keycloak admin console.
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
